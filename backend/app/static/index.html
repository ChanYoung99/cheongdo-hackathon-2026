<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>다녀왔어요 | 오늘의 방문</title>
  <style>
    :root{font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif;color:#202b27;background:#f6f7f3;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#e8eee8;color:#23372c}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}
    .shell{max-width:1180px;margin:auto;padding:28px 24px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:#276749;color:white;display:grid;place-items:center;font-size:21px}.brand h1{font-size:20px;margin:0}.brand p,.muted{margin:4px 0 0;color:#758078;font-size:13px}.top-right{display:flex;align-items:center;gap:12px}.demo{background:#e8f4e9;color:#276749;padding:8px 11px;border-radius:20px;font-size:12px;font-weight:700}
    .intro{margin:24px 0}.intro h2{font-size:28px;margin:0 0 8px;letter-spacing:-.7px}.intro p{margin:0;color:#69756e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 26px}.stat,.panel,.visit-card,.task{background:#fff;border:1px solid #e8ebe6;border-radius:16px}.stat{padding:18px 20px}.stat label{font-size:13px;color:#758078}.stat strong{display:block;font-size:26px;margin-top:8px}.layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(350px,.92fr);gap:20px;align-items:start}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h3{margin:0;font-size:17px}.list{display:grid;gap:10px}.visit-card{padding:15px;cursor:pointer;transition:border-color .15s,box-shadow .15s}.visit-card.selected{border-color:#55936e;box-shadow:0 0 0 2px #e1eee4}.visit-line{display:flex;justify-content:space-between;gap:12px}.visit-card strong{font-size:15px}.visit-card p{margin:7px 0 0;font-size:13px;color:#758078}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#f0f2ef;color:#68736c;white-space:nowrap}.badge.recording{background:#fff0ed;color:#b24b38}.badge.paused{background:#fff5da;color:#97711d}.badge.stopped{background:#e8f4e9;color:#276749}.right{display:grid;gap:16px}.detail-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detail-title h3{margin:0;font-size:19px}.detail-title p{margin:5px 0 0;color:#758078;font-size:13px}.notice{background:#f2f7f1;border-radius:10px;padding:12px;font-size:12px;color:#4e6254;line-height:1.55;margin:15px 0}.people{display:grid;gap:9px;margin:12px 0}.person{display:flex;justify-content:space-between;align-items:center;border:1px solid #edf0ec;border-radius:10px;padding:10px 12px;font-size:13px}.person-actions{display:flex;gap:6px}.person-actions button{padding:7px 9px;font-size:11px}.person-actions .yes{background:#e6f4e9;color:#276749}.person-actions .no{background:#fae9e6;color:#994d40}.check{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:#516057;line-height:1.5;margin:12px 0}.check input{margin-top:3px;accent-color:#276749}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.primary{background:#276749;color:white}.danger{background:#fae9e6;color:#994d40}.subtle{background:#f0f2ef}.transcript{white-space:pre-wrap;line-height:1.65;color:#405047;background:#f8f9f7;border-radius:10px;padding:13px;font-size:13px}.task-list{display:grid;gap:8px}.task{padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.task strong{font-size:13px}.task p{margin:5px 0 0;color:#758078;font-size:11px}.task button{font-size:11px;padding:7px 9px}.empty{padding:20px;text-align:center;color:#758078;font-size:13px}.small{font-size:11px;color:#79847d}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#25372d;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 6px 24px #17231d33;z-index:5;max-width:min(90vw,600px);font-size:13px}
    @media(max-width:800px){.shell{padding:18px 14px 40px}.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:22px}.intro h2{font-size:24px}.top{align-items:flex-start}.top-right{flex-direction:column;align-items:flex-end}}
    @media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.person{align-items:flex-start;gap:8px}.person-actions{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo" aria-hidden="true">다</div><div><h1>다녀왔어요</h1><p>사회복지사 방문 업무 도우미</p></div></div>
      <div class="top-right"><span class="demo">합성 데이터 데모</span><button class="subtle" onclick="location.href='/docs'">API 문서</button></div>
    </header>
    <section class="intro"><h2>오늘의 방문과 할 일을 한눈에</h2><p>방문 준비부터 동의 확인, 기록 검토와 후속 업무까지 이어서 관리하세요.</p></section>
    <section class="stats" aria-label="오늘 요약">
      <div class="stat"><label>오늘 방문</label><strong id="visit-count">-</strong></div>
      <div class="stat"><label>남은 후속 업무</label><strong id="task-count">-</strong></div>
      <div class="stat"><label>승인한 기록</label><strong id="approved-count">-</strong></div>
    </section>
    <section class="layout">
      <div class="panel">
        <div class="panel-head"><h3>오늘 방문 일정</h3><span class="actions" style="margin:0"><button class="subtle" onclick="moveVisit(-1)">↑ 순서 올리기</button><button class="subtle" onclick="moveVisit(1)">↓ 순서 내리기</button></span></div>
        <div id="visits" class="list"><div class="empty">일정을 불러오는 중입니다…</div></div>
        <div id="case-profile" class="notice" style="margin-top:18px">방문 일정을 선택하면 사례 정보를 확인할 수 있습니다.</div>
        <div class="panel-head" style="margin:24px 0 12px"><h3>후속 업무</h3></div>
        <div class="actions" style="margin:0 0 12px">
          <select id="task-template" aria-label="추가할 후속 업무" style="flex:1;min-width:180px;padding:10px;border:1px solid #dfe5df;border-radius:9px;background:white">
            <option value="보건소 문의 결과를 다음 방문에 확인">보건소 문의 결과 확인</option>
            <option value="난방 지원 정보 확인">난방 지원 정보 확인</option>
            <option value="식사 상태 다음 방문 확인">식사 상태 확인</option>
          </select>
          <input id="task-due" type="date" aria-label="업무 기한" style="padding:9px;border:1px solid #dfe5df;border-radius:9px">
          <button class="primary" onclick="createTask()">업무 추가</button>
        </div>
        <div id="tasks" class="task-list"></div>
      </div>
      <div class="right">
        <section class="panel" id="detail"><div class="empty">방문 일정을 선택해 주세요.</div></section>
        <section class="panel hidden" id="record-panel"></section>
      </div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    const API = "/api/v1";
    let visits = [], tasks = [], selectedId = null, draft = null;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const statusText = {scheduled:"방문 예정",recording:"녹음 중",paused:"일시정지",stopped:"방문 완료"};
    const categoryText = {health_condition:"건강·컨디션",food:"식사",home:"주거환경",emotion:"정서",living_welfare:"생활·복지",medication_schedule:"약 관련 언급",next_visit:"다음 방문 확인"};
    async function request(path, options={}) {
      const response = await fetch(API + path, {headers:{"Content-Type":"application/json"}, ...options});
      const data = response.status === 204 ? null : await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail?.message || data.detail || `요청 실패 (${response.status})`);
      return data;
    }
    function toast(message) {
      const el=$("toast"); el.textContent=message; el.classList.remove("hidden");
      clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.classList.add("hidden"),4000);
    }
    async function refresh(keep=true) {
      try {
        const data=await request("/dashboard"); visits=data.visits; tasks=data.open_tasks;
        $("visit-count").textContent=visits.length; $("task-count").textContent=tasks.length; $("approved-count").textContent=data.approved_drafts;
        if (!selectedId || !visits.some(v=>v.id===selectedId)) selectedId=visits[0]?.id || null;
        renderVisits(); renderTasks();
        if (selectedId) await showVisit(selectedId, keep);
      } catch(e) { $("visits").innerHTML=`<div class="empty">서버에 연결할 수 없습니다: ${esc(e.message)}</div>`; }
    }
    function renderVisits() {
      $("visits").innerHTML=visits.map(v=>`<article class="visit-card ${v.id===selectedId?"selected":""}" tabindex="0" role="button" onclick="selectVisit('${esc(v.id)}')" onkeydown="if(event.key==='Enter')selectVisit('${esc(v.id)}')">
        <div class="visit-line"><strong>${esc(v.time)} · ${esc(v.case_label)}</strong><span class="badge ${esc(v.status)}">${statusText[v.status]||"방문 예정"}</span></div>
        <p>${esc(v.address)} · 이동 약 ${esc(v.travel_minutes)}분</p><p>${esc(v.participants.length)}명 참여 · ${v.consent_ready?"동의 확인 완료":"동의 확인 필요"}</p>
      </article>`).join("");
    }
    function renderTasks() {
      $("tasks").innerHTML=tasks.length?tasks.map(t=>`<div class="task"><div><strong>${esc(t.title)}</strong><p>${esc(t.case_label)}${t.due_date?` · 기한 ${esc(t.due_date)}`:""}</p></div><button onclick="completeTask('${esc(t.id)}')">완료</button></div>`).join(""):'<div class="empty">남은 후속 업무가 없습니다.</div>';
    }
    async function moveVisit(delta) {
      const current=visits.findIndex(v=>v.id===selectedId), target=current+delta;
      if(current<0||target<0||target>=visits.length)return;
      const order=visits.map(v=>v.id); [order[current],order[target]]=[order[target],order[current]];
      try { await request("/schedule/order",{method:"PUT",body:JSON.stringify({visit_ids:order})}); await refresh(); toast("방문 순서를 변경했습니다."); }
      catch(e){toast(e.message);}
    }
    async function renderCaseProfile(caseId) {
      try {
        const c=await request(`/cases/${caseId}`);
        $("case-profile").innerHTML=`<strong>사례 메모 · ${esc(c.name)}</strong><p style="margin:7px 0">${esc(c.summary)}</p><span class="small">최근 방문: ${esc(c.last_visit)}<br>다음 확인: ${esc(c.next_check)} · 연결 업무 ${c.tasks.length}건</span>`;
      } catch(e) { $("case-profile").textContent=`사례 정보를 불러오지 못했습니다: ${e.message}`; }
    }
    async function selectVisit(id) { selectedId=id; draft=null; renderVisits(); await showVisit(id,false); }
    async function showVisit(id, keep=true) {
      try {
        const v=await request(`/visits/${id}`); const canRecord=v.consent_ready;
        $("detail").innerHTML=`<div class="detail-title"><div><h3>${esc(v.case_label)}</h3><p>${esc(v.time)} 방문 · ${esc(v.address)}</p></div><span class="badge ${esc(v.status)}">${statusText[v.status]}</span></div>
        <div class="notice"><b>안전 안내</b><br>참여자에게 녹음 목적과 외부 AI 처리 여부를 먼저 설명하고 동의를 받으세요. 현재 화면은 합성 사례로만 동작하는 데모입니다. 실제 마이크 녹음·전사는 연결되어 있지 않습니다.</div>
        <div class="panel-head"><h3>참여자 동의</h3><span class="small">${v.participants.filter(p=>p.consent==="consented").length}/${v.participants.length}명 동의</span></div>
        <div class="people">${v.participants.map(p=>`<div class="person"><span>${esc(p.label)} <span class="small">· ${esc(p.role)}</span></span><span class="person-actions">${p.consent==="consented"?'<span class="badge stopped">동의함</span>':p.consent==="declined"?'<span class="badge recording">동의 안 함</span>':`<button class="yes" onclick="setConsent('${esc(v.id)}','${esc(p.id)}','consented')">동의함</button><button class="no" onclick="setConsent('${esc(v.id)}','${esc(p.id)}','declined')">거부</button>`}</span></div>`).join("")}</div>
        ${v.status!=="stopped"?`<label class="check"><input type="checkbox" id="participant-check" ${v.participants_confirmed?"checked":""}><span>현재 대화 참여자가 모두 목록에 있고, 녹음 목적과 AI 처리 안내를 설명했음을 확인합니다.</span></label>
        <div class="actions"><button class="subtle" onclick="confirmParticipants('${esc(v.id)}')" ${v.status==="recording"?"disabled":""}>참여자 확인</button>
        ${v.status==="scheduled"?`<button class="primary" onclick="recordAction('${esc(v.id)}','start')" ${canRecord?"":"disabled"}>녹음 시작</button>`:""}
        ${v.status==="recording"?`<button class="subtle" onclick="recordAction('${esc(v.id)}','pause')">일시정지</button>`:""}
        ${v.status==="paused"?`<button class="primary" onclick="recordAction('${esc(v.id)}','resume')" ${canRecord?"":"disabled"}>재개</button>`:""}
        ${["recording","paused"].includes(v.status)?`<button class="danger" onclick="recordAction('${esc(v.id)}','stop')">방문 종료</button>`:""}</div>
        ${!canRecord?'<p class="small">모든 참여자가 동의하고 참여자 확인을 마쳐야 시작·재개할 수 있습니다.</p>':""}`
        :`<div class="actions"><button class="primary" onclick="loadTranscript('${esc(v.id)}')">합성 전사 확인</button><button class="subtle" onclick="generateDraft('${esc(v.id)}')">AI 일지 초안 만들기</button></div>`}
        <div id="visit-content">${keep?$("visit-content")?.innerHTML||"":""}</div>`;
        await renderCaseProfile(v.case_id);
      } catch(e) { toast(e.message); }
    }
    async function setConsent(visit, person, consent) {
      try { await request(`/visits/${visit}/participants/${person}/consent`,{method:"PUT",body:JSON.stringify({consent})}); await refresh(); }
      catch(e){toast(e.message);}
    }
    async function confirmParticipants(id) {
      if (!$("participant-check")?.checked) return toast("참여자와 안내 내용을 확인한 뒤 체크해 주세요.");
      try { await request(`/visits/${id}/participants-confirmation`,{method:"PUT",body:JSON.stringify({confirmed:true})}); await refresh(); toast("참여자 확인을 저장했습니다."); }
      catch(e){toast(e.message);}
    }
    async function recordAction(id, action) {
      try {
        if (action==="start" && !$("participant-check")?.checked) return toast("녹음 전에 참여자와 안내 내용을 확인해 주세요.");
        if (action==="start" && !(await request(`/visits/${id}`)).participants_confirmed) await request(`/visits/${id}/participants-confirmation`,{method:"PUT",body:JSON.stringify({confirmed:true})});
        await request(`/visits/${id}/recording/${action}`,{method:"POST"}); draft=null; await refresh(false);
        if(action==="stop") toast("방문을 종료했습니다. 데모 전사를 확인할 수 있습니다.");
      } catch(e){toast(e.message);}
    }
    async function loadTranscript(id) {
      try { const data=await request(`/visits/${id}/transcript`); $("visit-content").innerHTML=`<h3 style="margin:18px 0 10px">방문 대화 전사 <span class="badge">합성 데이터</span></h3><div class="transcript">${esc(data.text)}</div><p class="small">실제 녹음·음성인식 결과가 아닌 사전 준비된 합성 데모 문장입니다.</p>`; }
      catch(e){toast(e.message);}
    }
    async function generateDraft(id) {
      try {
        const response=await fetch(API+"/visits/draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({visit_id:id})});
        if(!response.ok){const err=await response.json().catch(()=>({})); throw new Error(err.detail?.message||err.detail||`초안 생성 실패 (${response.status})`);}
        const reader=response.body.getReader(), decoder=new TextDecoder(); let buffer="";
        while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const blocks=buffer.split("\n\n");buffer=blocks.pop();for(const block of blocks){const event=block.match(/^event: (.+)$/m)?.[1],data=JSON.parse(block.match(/^data: (.+)$/m)?.[1]||"{}");if(event==="draft"){draft=data;renderDraft(id);}if(event==="error")throw new Error(data.message);}}
      } catch(e){toast(e.message);}
    }
    function renderDraft(id) {
      const items=(draft.items||[]).map((item,i)=>`<label class="person" style="display:block"><span class="small">${categoryText[item.category]||esc(item.category)}</span><textarea id="draft-item-${i}" style="display:block;width:100%;margin:7px 0;padding:9px;border:1px solid #dfe5df;border-radius:8px;font:inherit">${esc(item.content)}</textarea><span class="small">근거: “${esc(item.evidence)}”</span></label>`).join("");
      const actions=(draft.follow_up_actions||[]).map((a,i)=>`<label class="person" style="display:block"><textarea id="draft-action-${i}" style="display:block;width:100%;padding:9px;border:1px solid #dfe5df;border-radius:8px;font:inherit">${esc(a.task)}</textarea><span class="small">근거: “${esc(a.evidence)}”</span></label>`).join("");
      $("visit-content").innerHTML=`<h3 style="margin:18px 0 10px">AI가 만든 검토용 초안</h3><p class="small">초안은 승인 전 기록이 아닙니다. 내용을 검토하고 필요하면 수정·삭제하세요.</p><div class="list">${items||'<p class="small">일지 항목이 없습니다.</p>'}${actions}</div><div class="actions"><button class="primary" onclick="approveDraft('${esc(id)}')">검토 완료 · 승인 저장</button></div>`;
    }
    async function approveDraft(id) {
      if(!draft)return;
      const finalDraft={...draft,items:draft.items.map((item,i)=>({...item,content:$(`draft-item-${i}`)?.value||item.content})).filter((_,i)=>$(`draft-item-${i}`)?.value?.trim()),follow_up_actions:draft.follow_up_actions.map((a,i)=>({...a,task:$(`draft-action-${i}`)?.value||a.task})).filter((_,i)=>$(`draft-action-${i}`)?.value?.trim())};
      try { await request(`/visits/${id}/drafts/draft-${Date.now().toString(36)}/approve`,{method:"POST",body:JSON.stringify(finalDraft)}); draft=null; await refresh(false); toast("검토한 초안을 승인 저장했습니다."); }
      catch(e){toast(e.message);}
    }
    async function completeTask(id) {
      try { await request(`/tasks/${id}`,{method:"PUT",body:JSON.stringify({status:"done"})}); await refresh(); toast("업무를 완료 처리했습니다."); }
      catch(e){toast(e.message);}
    }
    async function createTask() {
      const visit=visits.find(v=>v.id===selectedId);
      if(!visit)return toast("연결할 방문 사례를 먼저 선택해 주세요.");
      const title=$("task-template").value, due=$("task-due").value;
      try {
        await request("/tasks",{method:"POST",body:JSON.stringify({case_id:visit.case_id,title,due_date:due||null,priority:"normal"})});
        $("task-due").value=""; await refresh(); toast("선택한 사례에 후속 업무를 추가했습니다.");
      } catch(e){toast(e.message);}
    }
    refresh();
  </script>
</body>
</html>
